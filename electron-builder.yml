appId: com.electron.app
productName: writ
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!build/*"
  - "!packaging/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!svelte.config.mjs"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
# Ship the launcher script inside the package so the install hook can
# symlink /usr/bin/writ to it. `to:` is relative to the install dir (e.g.
# /opt/writ/ for pacman), so the final path is /opt/writ/bin/writ.
extraFiles:
  - from: build/writ-launcher.sh
    to: bin/writ
win:
  executableName: writ
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # pacman / deb ship the CLI on PATH via a post-install symlink (see the
  # shared scripts in build/maintainer). AppImage has no install hook, so
  # a custom AppRun (injected via afterPack — see build/afterPack.cjs)
  # delegates to the same bin/writ launcher; users put it on PATH by
  # renaming/symlinking the .AppImage to `writ`. snap is a separate
  # backlog task (F40AVM).
  target:
    - pacman
    - deb
    - AppImage
  maintainer: "Fredrik Lokander <fredrik@lokander.no>"
  category: Utility
  executableName: writ
pacman:
  # Pass through to fpm's pacman generator. `--after-install` and
  # `--before-remove` become the body of pacman's post_install() and
  # pre_remove() functions inside the package's .INSTALL file. The
  # post-install script symlinks /usr/bin/writ → /opt/writ/bin/writ; the
  # pre-remove script cleans the symlink up.
  fpm:
    - "--after-install=build/maintainer/post-install.sh"
    - "--before-remove=build/maintainer/pre-remove.sh"
deb:
  # Same fpm passthrough as pacman; fpm wraps the same script bodies into
  # Debian's `postinst` and `prerm` maintainer scripts instead of the
  # pacman .INSTALL file. The install layout matches (`/opt/writ/`), so
  # the /usr/bin/writ → /opt/writ/bin/writ symlink works identically.
  fpm:
    - "--after-install=build/maintainer/post-install.sh"
    - "--before-remove=build/maintainer/pre-remove.sh"
  # electron-builder's default deb depends list is the upstream Electron
  # template, but Electron 39 also dynamically loads libasound at startup
  # (audio) — without it the binary dies with `error while loading shared
  # libraries: libasound.so.2`. Redeclaring the defaults here because
  # this list replaces, not appends. `libasound2` on Debian trixie /
  # Ubuntu 24.04+ is satisfied by the t64 transitional package.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
appImage:
  artifactName: ${name}-${version}.${ext}
afterPack: build/afterPack.cjs
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
