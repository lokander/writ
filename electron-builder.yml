appId: com.electron.app
productName: writ
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!build/*"
  - "!packaging/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!svelte.config.mjs"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
# Ship the launcher script inside the package so the install hook can
# symlink /usr/bin/writ to it. `to:` is relative to the install dir (e.g.
# /opt/writ/ for pacman), so the final path is /opt/writ/bin/writ.
extraFiles:
  - from: build/writ-launcher.sh
    to: bin/writ
win:
  executableName: writ
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # pacman ships the CLI on PATH via a post-install symlink. AppImage has
  # no install hook, so a custom AppRun (injected via afterPack — see
  # build/afterPack.cjs) delegates to the same bin/writ launcher; users
  # put it on PATH by renaming/symlinking the .AppImage to `writ`.
  # snap / deb are separate backlog tasks (F40AVM / KZDJSY).
  target:
    - pacman
    - AppImage
  maintainer: "Fredrik Lokander <fredrik@lokander.no>"
  category: Utility
  executableName: writ
pacman:
  # Pass through to fpm's pacman generator. `--after-install` and
  # `--before-remove` become the body of pacman's post_install() and
  # pre_remove() functions inside the package's .INSTALL file. The
  # post-install script symlinks /usr/bin/writ → /opt/writ/bin/writ; the
  # pre-remove script cleans the symlink up.
  fpm:
    - "--after-install=build/maintainer/post-install.sh"
    - "--before-remove=build/maintainer/pre-remove.sh"
appImage:
  artifactName: ${name}-${version}.${ext}
afterPack: build/afterPack.cjs
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
